global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway:8080']

  - job_name: 'control-plane'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['control-plane:8081']

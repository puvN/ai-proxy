name: ai-proxy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_proxy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_proxy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      GATEWAY_MODE: "true"
      LOG_LEVEL_GATEWAY: DEBUG
      PROVIDERS_JSON: '{"gemini":{"baseUrl":"https://generativelanguage.googleapis.com"},"openai":{"baseUrl":"https://api.openai.com"},"anthropic":{"baseUrl":"https://api.anthropic.com"}}'
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  control-plane:
    build:
      context: ..
      dockerfile: control-plane/Dockerfile
    environment:
      PORT: "8081"
      DATABASE_URL: jdbc:postgresql://postgres:5432/ai_proxy
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ADMIN_EMAILS: "admin@example.com"
      LOG_LEVEL_CONTROL_PLANE: DEBUG
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  loki:
    image: grafana/loki:2.9.8
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    command:
      - -config.file=/etc/loki/config.yaml

  promtail:
    image: grafana/promtail:2.9.8
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command:
      - -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # One-shot smoke tests. Not started by default (profile "smoke").
  # Run: docker compose --profile smoke run --rm smoke-tests
  # Or keep the named container for log inspection:
  #   docker compose --profile smoke up --force-recreate smoke-tests
  # Results (results.log + results.xml) are written to ./test-results on the host.
  smoke-tests:
    build:
      context: ./smoke
    container_name: ai-proxy-smoke-tests
    environment:
      GATEWAY_URL: http://gateway:8080
      CONTROL_PLANE_URL: http://control-plane:8081
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASS: admin-pass-123
      DAILY_LIMIT: "20"
      RESULTS_DIR: /results
    volumes:
      - ./test-results:/results
    depends_on:
      gateway:
        condition: service_started
      control-plane:
        condition: service_started
    profiles: ["smoke"]

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
    name: ai-proxy-pgdata
  loki-data:
